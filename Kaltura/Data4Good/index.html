<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data4Good Wizard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a14;
      overflow: hidden;
    }
    #genie-container {
      width: 100%;
      height: 100%;
    }
    #genie-container > * {
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
    }
  </style>
</head>
<body>
  <div id="genie-container"></div>
  <script type="module">
    try {
      const { embeds } = await import('https://unisphere.nvp1.ovp.kaltura.com/v1/loader/index.esm.js');
      const { apis } = await embeds.workspace({
        env: 'us',
        apis: ['genieChat'],
        session: {
          widgetId: '1_8n7jxdjz',
          partnerId: 6557042
        }
      });
      apis.genieChat.contained({ elementId: 'genie-container' });
    } catch (error) {
      console.error('Failed to create embeds:', error);
    }
  </script>
</body>
</html>
